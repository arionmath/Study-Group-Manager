name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn -B test --file pom.xml

  semgrep:
    name: SAST (Semgrep)
    needs: test
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Rodar Semgrep
        run: semgrep scan --config p/java --config p/owasp-top-ten --exclude src/test        

  sbom:
    name: SBOM (cdxgen)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar SBOM com cdxgen
        run: npx --yes @cyclonedx/cdxgen -t java -o bom.json .
      - name: Salvar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json
